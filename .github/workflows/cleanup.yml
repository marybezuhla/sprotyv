name: Clean up old runs

# Run by hand, once, after the history was rewritten: removes the runs and the deployment records
# made from commits that are no longer in the history of main (old titles and links to old
# commits). Runs and deployments of the current history stay. Cannot be undone.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Напишіть ТАК, щоб видалити старі запуски й записи розгортань"
        required: true

permissions:
  contents: read

jobs:
  clean:
    if: github.event.inputs.confirm == 'ТАК' || github.event.inputs.confirm == 'так'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
      deployments: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Remove runs and deployments of commits outside main's history
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SELF: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          git rev-list origin/main > keep.txt
          kept() { grep -qx "$1" keep.txt; }
          runs=0; deps=0
          # Runs: cancelled first if still waiting, then deleted
          gh api --paginate "repos/$REPO/actions/runs?per_page=100" --jq '.workflow_runs[] | "\(.id) \(.head_sha) \(.status)"' > runs.txt
          while read -r id sha status; do
            [ "$id" = "$SELF" ] && continue
            kept "$sha" && continue
            if [ "$status" != "completed" ]; then gh api -X POST "repos/$REPO/actions/runs/$id/cancel" >/dev/null 2>&1 || true; sleep 2; fi
            gh api -X DELETE "repos/$REPO/actions/runs/$id" >/dev/null 2>&1 && runs=$((runs+1)) || echo "::warning::run $id not deleted"
          done < runs.txt
          # Deployments: made inactive, then deleted
          gh api --paginate "repos/$REPO/deployments?per_page=100" --jq '.[] | "\(.id) \(.sha)"' > deps.txt
          while read -r id sha; do
            kept "$sha" && continue
            gh api -X POST "repos/$REPO/deployments/$id/statuses" -f state=inactive >/dev/null 2>&1 || true
            gh api -X DELETE "repos/$REPO/deployments/$id" >/dev/null 2>&1 && deps=$((deps+1)) || echo "::warning::deployment $id not deleted"
          done < deps.txt
          echo "Deleted $runs runs and $deps deployment records."
