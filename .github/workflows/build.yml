name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing gets write access unless a job asks for it below
permissions:
  contents: read

jobs:
  # Tests (with the screen checks, which download extra Android code). Kept apart from the APK
  # build, so nothing the tests run can touch what is published. No secrets, no write access.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      # Gradle itself is checked against a fixed checksum before it runs
      - name: Install Gradle (checksum verified)
        shell: bash
        run: bash scripts/ci/install_gradle.sh

      # Only caching, and only read here: nothing the tests run can change what the APK build uses
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: true

      # Every dependency is checked against reviewed checksums; without the file nothing is built
      - name: Require dependency checksums
        shell: bash
        run: |
          if [ ! -s gradle/verification-metadata.xml ]; then
            echo "::error::gradle/verification-metadata.xml is missing. Run 'Refresh dependency checksums' and review it."
            exit 1
          fi


      - name: Test
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon testReleaseUnitTest 2>&1 | tee test.log

      # Lint runs check code shipped inside libraries, so it stays here, away from the job that builds the APK
      - name: Lint (an error stops the build)
        shell: bash
        run: |
          set -o pipefail
          status=0
          gradle --no-daemon lintRelease 2>&1 | tee lint.log || status=$?
          echo "---- lint report"
          cat app/build/reports/lint.txt || true
          exit $status

      - name: Prepare test log
        if: always()
        shell: bash
        run: |
          mkdir -p log
          { echo "tests ${{ github.run_number }} ${{ job.status }}"; grep -E "^e: |error:|FAILED|What went wrong|Dependency verification" -A3 test.log | head -300; echo ----; tail -80 test.log; } > log/test.log || true
          find . -path "*/build/test-results/*" -name "*.xml" -exec cp {} log/ \; 2>/dev/null || true
          # Room's exported database layout, to check migrations against it
          cp -r personal/schemas log/schemas 2>/dev/null || true
          # Pictures of the screens drawn with neutral test data, for review
          cp -r app/build/screens log/screens 2>/dev/null || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          retention-days: 14
          name: test-log
          path: log/

  # Builds the unsigned APK in a fresh machine, without running any tests. No secrets, no write access.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      # Gradle itself is checked against a fixed checksum before it runs
      - name: Install Gradle (checksum verified)
        shell: bash
        run: bash scripts/ci/install_gradle.sh

      # Only caching; the Gradle used is the one checked above
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      # Runs no build code: only reads the source to check the module rules
      - name: Check modules (only app sees personal data, no network code in 1.0)
        shell: bash
        run: bash scripts/check_modules.sh

      # Every dependency is checked against reviewed checksums; without the file nothing is built
      - name: Require dependency checksums
        shell: bash
        run: |
          if [ ! -s gradle/verification-metadata.xml ]; then
            echo "::error::gradle/verification-metadata.xml is missing. Run 'Refresh dependency checksums' and review it."
            exit 1
          fi


      - name: Version
        id: version
        shell: bash
        run: |
          V=$(tr -d '[:space:]' < version.txt)
          [[ "$V" =~ ^[0-9]{1,2}\.[0-9]{1,2}\.[0-9]{1,2}$ ]] || { echo "::error::version.txt must be x.y.z"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Build (unsigned)
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease 2>&1 | tee build.log

      - name: Check modules in the resolved dependency graph
        shell: bash
        run: |
          set -euo pipefail
          for m in content reach; do
            gradle --no-daemon -q ":$m:dependencies" --configuration releaseRuntimeClasspath > "deps-$m.txt"
            grep -q "^" "deps-$m.txt" || { echo "::error::Could not read the dependencies of $m"; exit 1; }
            if grep -q "project :personal" "deps-$m.txt"; then echo "::error::$m depends on :personal"; exit 1; fi
          done

      - name: Check that no network code is in the app
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          unzip -o -q "$APK" 'classes*.dex' -d dex
          ls dex/classes*.dex >/dev/null || { echo "::error::No code found in the APK"; exit 1; }
          # Java's URL and socket classes from any library
          # grep reads the files itself: a pipe from cat would be cut short and pass by mistake
          if grep -a -q -E 'Ljava/net/HttpURLConnection;|Ljava/net/URLConnection;|Ljava/net/Socket;|Ljava/net/DatagramSocket;|Ljavax/net/ssl/|Landroid/net/http/' dex/classes*.dex; then
            echo "::error::Network classes found in the APK"; exit 1
          fi
          echo "No network classes in the APK"

      - name: Check permissions (no internet, only what is expected)
        shell: bash
        run: |
          set -euo pipefail
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT" dump permissions app/build/outputs/apk/release/app-release-unsigned.apk | tee permissions.txt
          # An empty or unreadable listing must stop the build, never pass as "nothing found"
          grep -q "^package:" permissions.txt || { echo "::error::Could not read the permissions"; exit 1; }
          # Every permission must be on this short list; anything else stops the build
          # Release 1.0: no internet. Each permission is added here on purpose:
          # USE_BIOMETRIC: the settings lock opens Android's own PIN window (no prompt, PIN never seen)
          # POST_NOTIFICATIONS: notifications the owner switches on (Android asks first)
          # RECEIVE_BOOT_COMPLETED: alarms of those notifications planned again after a restart
          # HIDE_OVERLAY_WINDOWS: other apps' floating windows are hidden over the screens of My data
          ALLOWED="ua.sprotyv.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION android.permission.USE_BIOMETRIC android.permission.POST_NOTIFICATIONS android.permission.RECEIVE_BOOT_COMPLETED android.permission.HIDE_OVERLAY_WINDOWS"
          for p in $(grep -oE "name='[^']+'" permissions.txt | sed "s/name='//;s/'//"); do
            case " $ALLOWED " in
              *" $p "*) ;;
              *) echo "::error::Unexpected permission: $p"; exit 1 ;;
            esac
          done

      - name: Check the manifest (no backup, not debuggable, nothing open without a reason)
        shell: bash
        run: |
          set -euo pipefail
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT" dump xmltree --file AndroidManifest.xml app/build/outputs/apk/release/app-release-unsigned.apk > manifest.txt
          python3 scripts/ci/check_manifest.py manifest.txt

      - name: Prepare build log
        if: always()
        shell: bash
        run: |
          mkdir -p log
          # What the APK carries besides code (assets), to check that nothing is missing or renamed
          unzip -l app/build/outputs/apk/release/app-release-unsigned.apk 'assets/*' > log/assets.txt 2>&1 || true
          { echo "run ${{ github.run_number }} ${{ job.status }}"; grep -E "^e: |error:|FAILED|What went wrong|Dependency verification" -A3 build.log | head -300; echo ----; tail -150 build.log; } > log/build.log || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          retention-days: 14
          name: build-log
          path: log/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          retention-days: 14
          name: sprotyv-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk

  # Signs and publishes. Only for main, only in the "release" environment, and with no Gradle
  # or other third-party build code: just the Android SDK's own apksigner.
  release:
    # Published only when the tests passed too
    needs: [test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
    outputs:
      signed: ${{ steps.secrets.outputs.ready }}
    steps:
      - name: Check that signing secrets exist
        id: secrets
        env:
          PASS: ${{ secrets.SPROTYV_SIGNING_PASS }}
          STORE: ${{ secrets.SPROTYV_STORE_PASS }}
          KEYSTORE: ${{ secrets.SPROTYV_KEYSTORE }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if gh release view "v$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::notice::v$VERSION is already published; raise version.txt for a new release."
          elif [ -n "$PASS" ] && [ -n "$STORE" ] && [ -n "$KEYSTORE" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Signing secrets are not set; nothing is published."
          fi

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.secrets.outputs.ready == 'true'
        with:
          name: sprotyv-unsigned
          path: unsigned

      - name: Sign
        if: steps.secrets.outputs.ready == 'true'
        env:
          PASS: ${{ secrets.SPROTYV_SIGNING_PASS }}
          STORE: ${{ secrets.SPROTYV_STORE_PASS }}
          KEYSTORE: ${{ secrets.SPROTYV_KEYSTORE }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -eo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          # The key lives only in the release environment's secrets, still encrypted with its own password
          printf %s "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/ks.enc"
          printf %s "$PASS" > "$RUNNER_TEMP/p"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in "$RUNNER_TEMP/ks.enc" -out "$RUNNER_TEMP/sprotyv.jks" -pass file:"$RUNNER_TEMP/p"
          rm "$RUNNER_TEMP/p" "$RUNNER_TEMP/ks.enc"
          mkdir -p out
          # Signed exactly as built, nothing rewritten first: then an independent build of the same
          # source (F-Droid's) matches ours byte for byte apart from the signature. Checked, not changed
          "$BT/zipalign" -c -P 16 4 unsigned/app-release-unsigned.apk
          OUT="out/sprotyv-$VERSION.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/sprotyv.jks" --ks-key-alias sprotyv \
            --alignment-preserved --ks-pass env:STORE --key-pass env:STORE --out "$OUT" unsigned/app-release-unsigned.apk
          rm -f "$RUNNER_TEMP/sprotyv.jks"
          # The certificate must be exactly Sprotyv's own
          "$BT/apksigner" verify --print-certs "$OUT" | tee certs.txt
          if ! tr -d ' ' < certs.txt | grep -qi "SHA-256digest:d00241499cd44d0859c5762a0b4cc317862358c8df3210fc3a0e9473e038a1ac"; then
            echo "::error::Unexpected signing certificate"; exit 1
          fi

      - name: Remove the decrypted key
        if: always()
        run: rm -f "$RUNNER_TEMP/sprotyv.jks" "$RUNNER_TEMP/p" "$RUNNER_TEMP/ks.enc"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          retention-days: 14
          name: sprotyv-signed
          path: out/*.apk

  # Publishes the signed APK. Never sees the signing key; uses only GitHub's own gh tool.
  publish:
    needs: [build, release]
    if: needs.release.outputs.signed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          sparse-checkout: .github
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sprotyv-signed
          path: out
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          # The same version is never published twice: raise version.txt for a new release
          if gh release view "v$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::v$VERSION is already published; raise version.txt"; exit 1
          fi
          # The notes kept in the repository, then the SHA-256 of the APK, so anyone can check their download
          cp .github/release-notes.md notes.md
          SUM=$(cd out && sha256sum *.apk)
          printf '\nSHA-256:\n```\n%s\n```\n' "$SUM" >> notes.md
          gh release create "v$VERSION" out/*.apk \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "Sprotyv $VERSION" --notes-file notes.md --latest
